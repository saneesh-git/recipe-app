{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>addrecpe</title>
    <link rel="stylesheet" href="{% static '/css/addrecpe.css' %}">
</head>
<body>
    <div class="container">
        <h2>Add Recipe</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="name">title</label>
                <input type="text" id="title" name="title" required >
            </div>
            <div class="form-group">
                <label for="email">image</label>
                <input type="image" id="image" name="image" required >
            </div>
            <div class="form-group">
                <label for="password">ingrediants</label>
                <input type="ingrediants" id="ingrediants"  name="ingrediants" required>
            </div>
            <div class="form-group">
                <label for="password">description</label>
                <input type="description" id="description"  name="description" required>
            </div>
            <div class="form-group">
                <label for="password">instructions</label>
                <input type="instructions" id="instructions"  name="instructions" required>
            </div>
            <button type="submit">Add Recipe</button>
        </form>
    </div>
</body>
</html>
